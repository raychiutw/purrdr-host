name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# 群組名稱帶 workflow 名稱：被其他 workflow(例如 Release)呼叫時不會跟 PR 的 CI 搶同一個群組。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主機服務(host-service/,raychiutw/purrdr.ios ADR-0010):三平台各跑一次，herdr socket 路徑解析與假 herdr socket
  # (macOS／Linux 是 Unix socket,Windows 是 named pipe)都要在該平台實跑。
  # 協定型別(Rust 與 generated/swift/)是否與 protocol/host-service.schema.json 同步，由 codegen 的測試把關。
  # 主機外掛(host-plugin/)的 notify.sh 測試在 macOS／Linux 實跑(plugin-tests)。
  host-service:
    name: 主機服務測試(cargo test,${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-2025]
    defaults:
      run:
        working-directory: host-service
        shell: bash
    env:
      RUSTFLAGS: -D warnings
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: 安裝 Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo --version

      # Release 頁面的「本版更新」取自這份檔案，升版時要一起寫。
      - name: 版本說明
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          version="$(scripts/host-service-version.sh)"
          grep -qx "## $version" host-service/CHANGELOG.md || { echo "::error::host-service/CHANGELOG.md 缺少 ## $version 的版本說明"; exit 1; }

      - name: 格式與 clippy
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked
